<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kio Board</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="shortcut icon" type="image/ico" href="/favicon.ico" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ionic App" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body>
    <div id="app">
      <div id="app-preloader" aria-label="Loading" role="status">
        <div class="preloader-mark">
          <span class="preloader-spinner" aria-hidden="true"></span>
        </div>
        <p class="preloader-text">Loading Kio Board…</p>
      </div>
    </div>
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f4f6fb;
        color: #374151;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      .preloader-mark {
        width: 56px;
        height: 56px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .preloader-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #dbe4f5;
        border-top-color: #2f6fed;
        border-radius: 50%;
        animation: app-preloader-spin 0.9s linear infinite;
      }

      .preloader-text {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #4b5563;
      }

      @keyframes app-preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        #app-preloader {
          background: #0f172a;
          color: #e5e7eb;
        }

        .preloader-spinner {
          border-color: #334155;
          border-top-color: #60a5fa;
        }

        .preloader-text {
          color: #cbd5e1;
        }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
